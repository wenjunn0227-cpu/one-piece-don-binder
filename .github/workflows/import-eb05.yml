name: Import EB-05 DON artwork
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/import-eb05.py'
      - '.github/workflows/import-eb05.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4 pillow
      - run: python scripts/import-eb05.py
      - name: Commit any verified image files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cards/274.webp cards/275.webp 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Add EB-05 DON artwork images"
            git pull --rebase
            git push
          fi
