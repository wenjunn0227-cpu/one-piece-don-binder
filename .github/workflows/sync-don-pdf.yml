name: Sync official DON PDF
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-don-pdf.yml'
permissions:
  contents: write
jobs:
  sync-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest official DON PDF
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          curl --fail --location --retry 3 --user-agent "Mozilla/5.0" "https://www.onepiece-cardgame.com/pdf/don-cardlist.pdf?cache_bust=20261112" --output latest.pdf
          pages=$(pdfinfo latest.pdf | awk '/^Pages:/ {print $2}')
          echo "Latest official PDF pages: $pages"
          test "$pages" -ge 31 || { echo "Official CDN still serves older 30-page PDF. Existing file will be kept."; exit 0; }
          mv latest.pdf "Card List.pdf"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "Card List.pdf"
          if ! git diff --cached --quiet; then
            git commit -m "Update DON catalog to 31-page OP17 official PDF"
            git pull --rebase
            git push
          fi
