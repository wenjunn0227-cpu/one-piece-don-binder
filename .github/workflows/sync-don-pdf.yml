name: Sync official DON PDF
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-don-pdf.yml'
permissions:
  contents: write
jobs:
  sync-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all official regional DON card catalogs
        run: |
          python -m pip -q install requests pymupdf
          python scripts/find-latest-pdf.py
      - name: Commit verified newer PDF
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "Card List.pdf"
          if ! git diff --cached --quiet; then
            git commit -m "Update official DON card catalog with OP16 and OP17"
            git pull --rebase
            git push
          fi
