name: Sync official DON PDF
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-don-pdf.yml'
permissions:
  contents: write
jobs:
  sync-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Bandai DON card list
        run: |
          curl --fail --location --retry 3 --user-agent "Mozilla/5.0" "https://www.onepiece-cardgame.com/pdf/don-cardlist.pdf" --output "Card List.pdf"
          test $(stat -c%s "Card List.pdf") -gt 100000
          pdfinfo "Card List.pdf" | grep Pages || true
      - name: Commit PDF if updated
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "Card List.pdf"
          if ! git diff --cached --quiet; then
            git commit -m "Add official DON card list PDF"
            git push
          fi
